# Source of truth for the LaTeX resume.
#
# Rebuilt 2026-08 from the resumes in cv_data/:
#   Usairam_Saeed_Full_Stack_Resume.pdf
#   Usairam_Saeed_SWE_AI_Engineer_Resume.pdf
#   Usairam_Saeed_UIUX_Resume.pdf
#
# Every bullet below is taken from one of those files. `src` records which one,
# so nothing here is invented and you can trace any line back to a document you
# wrote. Bullets carry `tags`; the tailor scores them against the job
# description and keeps the highest-scoring ones per role.
#
# Editing rules: add facts, never invent metrics. If a number is not in a resume
# you actually sent, it does not belong here.

candidate:
  name: "Usairam Saeed"
  title: "Full Stack Developer"
  email: "saeed.usairam@gmail.com"
  phone: "+92 301 8165385"
  location: "Mansehra, Pakistan"
  links:
    - { label: "LinkedIn", url: "https://www.linkedin.com/in/usairam-saeed-148044285/" }
    - { label: "GitHub", url: "https://github.com/saymi313" }
    - { label: "Portfolio", url: "https://usairam-saeed.vercel.app/" }

  # Two lines, and they lead with years and impact rather than a stack list.
  # The stack belongs in Skills, where a parser expects to find it.
  summary: >
    Full Stack Developer and Frontend Team Lead with 2+ years shipping production
    web applications end to end in React, Node.js, Express and MongoDB. Leads a team
    of 10, owning delivery across payment integrations, real time systems and RESTful
    API design, and running code reviews and sprint planning across the team. Works
    the full stack into the cloud — AWS, Docker and Kubernetes — with a focus on
    scalable, maintainable systems and clean, ATS-readable delivery.

# Alternate summaries the tailor swaps in when the job description leans a
# particular way. Keyword triggers live in `modes_triggers`.
modes:
  ai_summary: >
    AI Software Engineer and Full Stack Developer with 2+ years building production
    web applications and AI powered systems. Works across machine learning, NLP and
    sentiment analysis alongside React, Node.js, Express and MongoDB, designing RESTful
    APIs and scalable backend architecture for real time products. Ships AI into working
    software — integrated, deployed on AWS with Docker, and owned end to end — rather
    than leaving it in a notebook.
  ux_summary: >
    UI/UX Designer and Frontend Team Lead with 2+ years shipping production interfaces.
    Runs the work end to end — user research, wireframes and interactive prototypes in
    Figma and Adobe XD — then builds the React and Tailwind CSS front end that implements
    them. Leads a team of 10 and owns the handoff from design system to shipped product,
    keeping accessibility and usability in view the whole way.

modes_triggers:
  ai_summary: [ai, machine learning, ml, nlp, deep learning, data science, llm, computer vision]
  ux_summary: [ux, ui/ux, user experience, product design, figma, wireframe, usability, design system]

# Lowercase substrings matched against the job description. A hit boosts every
# bullet carrying that tag.
tag_hints:
  react: [react, react.js, frontend, front-end, javascript, typescript, spa]
  leadership: [mentor, mentoring, team lead, lead, code review, sprint, agile, scrum]
  node: [node, node.js, express, backend, rest, api, microservice]
  mongo: [mongo, mongodb, nosql, database, schema]
  payments: [payment, stripe, billing, checkout, transaction, fintech, wallet]
  realtime: [real-time, real time, socket, websocket, chat, live]
  ai: [ai, machine learning, ml, nlp, deep learning, sentiment, model]
  cv: [computer vision, facial recognition, face detection, opencv, image]
  blockchain: [blockchain, web3, smart contract, solidity, tokenization, ethereum]
  cloud: [aws, cloud, docker, kubernetes, jenkins, ci/cd, devops, deployment]
  # Deliberately no bare "design": "design REST APIs" in a backend posting
  # must not pull Figma projects onto an engineering resume.
  ux: [ux, ui/ux, figma, wireframe, prototype, usability, user research,
       designer, design system, product design, user interface, user experience]
  performance: [performance, optimization, load time, scalability, concurrent]
  saas: [saas, b2b, platform, multi-tenant, subscription]
  trading: [trading, finance, backtest, portfolio, market data, algorithmic]

defaults:
  max_bullets_per_role: 5      # matches latex_resume.MAX_ROLE_BULLETS
  max_bullets_per_project: 3   # matches latex_resume.MAX_PROJECT_BULLETS; floor is 2
  # Projects are picked per job by relevance to the posting: most relevant
  # first, irrelevant ones dropped, at most four and never fewer than two.

